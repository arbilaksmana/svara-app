name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Build container
        run: docker build -t svara-ci .
      - name: Smoke container
        run: |
          docker run -d --name svara-ci -p 3000:3000 -e APP_ORIGIN=http://127.0.0.1:3000 svara-ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then
              ok=1
              break
            fi
            sleep 1
          done
          docker logs svara-ci
          docker rm -f svara-ci
          test "$ok" = "1"
