name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: svara
          POSTGRES_PASSWORD: svara_ci_password
          POSTGRES_DB: svara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svara -d svara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://svara:svara_ci_password@127.0.0.1:5432/svara_test
      TEST_DATABASE_URL: postgres://svara:svara_ci_password@127.0.0.1:5432/svara_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations against Postgres
        run: pnpm db:migrate
      - run: pnpm lint
      - name: API and migration tests
        run: pnpm test
      - name: Production web build
        run: pnpm build
      - name: Build containers
        run: |
          docker build -f Dockerfile.api -t svara-api-ci .
          docker build -f Dockerfile.web --build-arg API_ORIGIN=http://127.0.0.1:3001 -t svara-web-ci .
      - name: Create smoke database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE svara_smoke'
      - name: Start API container
        run: |
          docker run -d --name svara-api-ci --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e HOST=0.0.0.0 \
            -e DATABASE_URL=postgres://svara:svara_ci_password@127.0.0.1:5432/svara_smoke \
            -e APP_ORIGIN=http://127.0.0.1:3000 \
            svara-api-ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/v1/health; then
              ok=1
              break
            fi
            sleep 1
          done
          docker logs svara-api-ci
          test "$ok" = "1"
      - name: Bootstrap smoke admin
        run: |
          docker exec \
            -e BOOTSTRAP_ADMIN_EMAIL=admin@ci.local \
            -e BOOTSTRAP_ADMIN_NAME="CI Admin" \
            -e BOOTSTRAP_ADMIN_PASSWORD='CiStrongPass123!' \
            svara-api-ci tsx server/scripts/bootstrap-admin.ts
      - name: Start web container
        run: |
          docker run -d --name svara-web-ci --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            -e API_INTERNAL_URL=http://127.0.0.1:3001 \
            svara-web-ci
      - name: Smoke web, rewrite, and authenticated bootstrap
        env:
          SMOKE_WEB_ORIGIN: http://127.0.0.1:3000
          SMOKE_EMAIL: admin@ci.local
          SMOKE_PASSWORD: CiStrongPass123!
        run: node scripts/smoke-web.mjs
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs svara-api-ci 2>&1 || true
          docker logs svara-web-ci 2>&1 || true
          docker rm -f svara-api-ci svara-web-ci 2>&1 || true
