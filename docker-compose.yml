services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_admin_dev}
      POSTGRES_DB: postgres
      APP_DB_USER: ${POSTGRES_USER:-svara}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-svara_dev_password}
      APP_DB_NAME: ${POSTGRES_DB:-svara}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - svara_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    image: svara-app:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SERVE_STATIC: 1
      DATABASE_URL: postgres://${POSTGRES_USER:-svara}:${POSTGRES_PASSWORD:-svara_dev_password}@db:5432/${POSTGRES_DB:-svara}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ENABLE_HSTS: ${ENABLE_HSTS:-0}
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  svara_pgdata:
