services:
  app:
    build: .
    image: svara-app:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SERVE_STATIC: 1
      DB_PATH: /app/data/svara.sqlite
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ENABLE_HSTS: ${ENABLE_HSTS:-0}
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:-}
    volumes:
      - svara_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  svara_data:
