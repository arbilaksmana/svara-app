services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_admin_dev}
      POSTGRES_DB: postgres
      APP_DB_USER: ${POSTGRES_USER:-svara}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-svara_dev_password}
      APP_DB_NAME: ${POSTGRES_DB:-svara}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - svara_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: svara-api:local
    restart: unless-stopped
    # OPS-05: ruang drain harus melebihi batas paksa shutdown API (SHUTDOWN_FORCE_EXIT_MS, maks 120 s).
    stop_grace_period: 130s
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-svara}:${POSTGRES_PASSWORD:-svara_dev_password}@db:5432/${POSTGRES_DB:-svara}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000,http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      ENABLE_HSTS: ${ENABLE_HSTS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      GUARDIAN_EVIDENCE_DIR: /app/var/guardian-evidence
    # Bukti wali harus bertahan saat image dibangun ulang; tanpa volume, berkas hilang bersama container.
    volumes:
      - svara_guardian_evidence:/app/var/guardian-evidence
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Build-time rewrite target. In production the ingress sends /api/*
        # directly to the api service; this keeps single-origin/local working.
        API_ORIGIN: ${API_ORIGIN_BUILD:-http://api:3001}
    image: svara-web:local
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3001
      ENABLE_HSTS: ${ENABLE_HSTS:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/auth/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  svara_pgdata:
  svara_guardian_evidence:
